# type-10042026-Maurice: optional estimate; missing configuration is Not Run, never zero.
name: Infracost estimate
on:
  pull_request:
    paths: ['platform/terraform/**']
permissions: {contents: read, pull-requests: write}
concurrency: {group: 'infracost-${{ github.event.pull_request.number }}', cancel-in-progress: true}
jobs:
  estimate:
    if: vars.INFRACOST_ENABLED == 'true' && secrets.INFRACOST_API_KEY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy: {fail-fast: true}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, retrieved 2026-10-04
        with: {persist-credentials: false}
      - name: Run configured estimate
        env: {INFRACOST_API_KEY: '${{ secrets.INFRACOST_API_KEY }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v infracost >/dev/null || { echo '::error title=Infracost::Configured but unavailable'; exit 1; }
          infracost breakdown --path platform/terraform --format json --out-file "$RUNNER_TEMP/infracost.json"
          echo '::notice title=Infracost::Estimate only; not a bill or deployment approval'
