# type-10042026-Maurice: credentialless static platform gates.
name: Platform validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TMPDIR: ${{ runner.temp }}/ehr-platform
  PIP_CACHE_DIR: ${{ runner.temp }}/ehr-pip
  HELM_CACHE_HOME: ${{ runner.temp }}/ehr-helm
  HELM_CONFIG_HOME: ${{ runner.temp }}/ehr-helm-config
  HELM_DATA_HOME: ${{ runner.temp }}/ehr-helm-data
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy: {fail-fast: true, matrix: {python: ['3.12']}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, official, retrieved 2026-10-04
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, official, retrieved 2026-10-04
        with: {python-version: '${{ matrix.python }}'}
      - name: Platform tests and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$HELM_CACHE_HOME" "$HELM_CONFIG_HOME" "$HELM_DATA_HOME"
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pytest -q backend/tests/test_ticket01_platform.py backend/tests/test_ticket02_platform.py backend/tests/test_ticket03_platform.py backend/tests/test_ticket04_platform.py backend/tests/test_ticket05_platform.py backend/tests/test_ticket06_terraform.py --maxfail=1
          python -m pytest -q backend/tests/test_ticket07.py --maxfail=1
      - name: CSV evidence contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open('docs/test-cases/ehr-devsecops-platform.csv')))
          ids = {r['Test Case ID'] for r in rows}
          expected = {f'TC-PLAT-{n:04d}' for n in range(37, 44)}
          assert expected <= ids, sorted(expected - ids)
          assert all(r['Status (Pass/Fail)'] == 'Not Run' for r in rows if r['Test Case ID'] in expected)
          print(f'::notice title=CSV evidence::{len(rows)} rows validated; live evidence remains Not Run')
          PY
      - name: Terraform validation
        shell: bash
        run: |
          set -Eeuo pipefail
          for root in platform/terraform/environments/*/*; do
            [[ -d "$root" ]] || continue
            terraform -chdir="$root" fmt -check -recursive
            terraform -chdir="$root" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$root" validate -no-color
          done
      - name: Helm validation profiles
        shell: bash
        run: |
          set -Eeuo pipefail
          helm dependency build platform/helm/ehr >/dev/null
          helm lint platform/helm/ehr
          for values in platform/helm/ehr/values-{demo,development,staging,k3s,kind,production}.yaml; do helm template ehr platform/helm/ehr -f "$values" >/dev/null; done
          rm -rf platform/helm/ehr/charts
      - name: Optional security and policy tools
        env:
          TFLINT_URL: ${{ vars.TFLINT_RELEASE_URL }}
          TFLINT_SHA256: ${{ vars.TFLINT_RELEASE_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for tool in tflint kubeconform kyverno gitleaks trivy; do
            if ! command -v "$tool" >/dev/null; then echo "::notice title=$tool::$tool is not installed; this gate is blocked, not passed"; fi
          done
          if ! command -v tflint >/dev/null && [[ -n "${TFLINT_URL:-}" ]]; then
            [[ "$TFLINT_URL" =~ ^https://github.com/terraform-linters/tflint/releases/download/ ]] || { echo '::error title=TFLint::Release URL is not an official TFLint release'; exit 1; }
            [[ "$TFLINT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error title=TFLint::A 64-character release checksum is required'; exit 1; }
            curl --fail --location --silent --show-error --max-time 60 "$TFLINT_URL" --output "$RUNNER_TEMP/tflint.zip"
            printf '%s  %s\n' "$TFLINT_SHA256" "$RUNNER_TEMP/tflint.zip" | sha256sum --check --status
            unzip -q "$RUNNER_TEMP/tflint.zip" -d "$RUNNER_TEMP/tflint"; export PATH="$RUNNER_TEMP/tflint:$PATH"
          fi
          if command -v tflint >/dev/null; then tflint --init --config .tflint.hcl; tflint --recursive --config .tflint.hcl; else echo '::notice title=TFLint::Not installed and no pinned release configured'; fi
          if command -v kubeconform >/dev/null; then kubeconform -strict -ignore-missing-schemas -schema-location default platform/gitops/*.yaml; fi
          if command -v kyverno >/dev/null; then kyverno apply platform/gitops/resources/kyverno-policies.yaml --resource platform/gitops/apps/namespaces.yaml; fi
          if command -v gitleaks >/dev/null; then gitleaks detect --no-banner --redact --config .gitleaks.toml; fi
          if command -v trivy >/dev/null; then trivy config --exit-code 1 --severity HIGH,CRITICAL --no-progress .; fi
      - name: Documentation local links
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import pathlib, re
          for p in pathlib.Path('docs').rglob('*.md'):
              for target in re.findall(r'\[[^]]+\]\(([^)#]+)', p.read_text()):
                  if not target.startswith(('http://', 'https://', '#')): assert (p.parent / target).resolve().exists(), f'{p}: {target}'
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, official, retrieved 2026-10-04
        with: {name: 'platform-validation-${{ github.run_id }}', path: '${{ runner.temp }}/ehr-platform', if-no-files-found: ignore, retention-days: 7}
