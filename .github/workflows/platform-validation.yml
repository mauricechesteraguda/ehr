# type-10042026-Maurice: credentialless static platform gates.
name: Platform validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # type-10052026-Maurice: disposable PostgreSQL service for Django CI only.
    services:
      postgres:
        image: postgres:17.2-alpine@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96
        env:
          POSTGRES_DB: ehr_ci_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_USER: ehr_ci_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_PASSWORD: ci_only_${{ github.run_id }}_${{ github.run_attempt }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_DB: ehr_ci_${{ github.run_id }}_${{ github.run_attempt }}
      POSTGRES_USER: ehr_ci_${{ github.run_id }}_${{ github.run_attempt }}
      POSTGRES_PASSWORD: ci_only_${{ github.run_id }}_${{ github.run_attempt }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
    strategy: {fail-fast: true, matrix: {python: ['3.12']}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, official, retrieved 2026-10-04
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, official, retrieved 2026-10-04
        with: {python-version: '${{ matrix.python }}'}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1, official, verified 2026-10-05
        with: {terraform_version: '1.9.8', terraform_wrapper: false}
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0, official, verified 2026-10-05
        with: {version: '3.16.4'}
      - name: Allocate runner-scoped temporary paths
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "TMPDIR=$RUNNER_TEMP/ehr-platform"
            echo "PIP_CACHE_DIR=$RUNNER_TEMP/ehr-pip"
            echo "HELM_CACHE_HOME=$RUNNER_TEMP/ehr-helm"
            echo "HELM_CONFIG_HOME=$RUNNER_TEMP/ehr-helm-config"
            echo "HELM_DATA_HOME=$RUNNER_TEMP/ehr-helm-data"
          } >> "$GITHUB_ENV"
      - name: Wait for PostgreSQL readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          for _attempt in $(seq 1 30); do
            pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" && exit 0
            sleep 1
          done
          exit 1
      - name: Platform tests and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$HELM_CACHE_HOME" "$HELM_CONFIG_HOME" "$HELM_DATA_HOME"
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pytest -q backend/tests/test_ticket01_platform.py backend/tests/test_ticket02_platform.py backend/tests/test_ticket03_platform.py backend/tests/test_ticket04_platform.py backend/tests/test_ticket05_platform.py backend/tests/test_ticket06_terraform.py --maxfail=1
          python -m pytest -q backend/tests/test_ticket07.py --maxfail=1
      - name: CSV evidence contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open('docs/test-cases/ehr-devsecops-platform.csv')))
          ids = {r['Test Case ID'] for r in rows}
          expected = {f'TC-PLAT-{n:04d}' for n in range(37, 44)}
          assert expected <= ids, sorted(expected - ids)
          assert all(r['Status (Pass/Fail)'] == 'Not Run' for r in rows if r['Test Case ID'] in expected)
          print(f'::notice title=CSV evidence::{len(rows)} rows validated; live evidence remains Not Run')
          PY
      - name: Terraform validation
        shell: bash
        run: |
          set -Eeuo pipefail
          for root in platform/terraform/environments/*/*; do
            [[ -d "$root" ]] || continue
            terraform -chdir="$root" fmt -check -recursive
            terraform -chdir="$root" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$root" validate -no-color
          done
      - name: Helm validation profiles
        shell: bash
        run: |
          set -Eeuo pipefail
          helm dependency build platform/helm/ehr >/dev/null
          helm lint platform/helm/ehr
          for values in platform/helm/ehr/values-{demo,development,staging,k3s,kind,production}.yaml; do helm template ehr platform/helm/ehr -f "$values" >/dev/null; done
          rm -rf platform/helm/ehr/charts
      - name: Optional security and policy tools
        shell: bash
        run: |
          set -Eeuo pipefail
          tools="$RUNNER_TEMP/ehr-platform/tools"; mkdir -p "$tools"
          curl --fail --location --silent --show-error --max-time 60 'https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz' -o "$tools/actionlint.tgz"
          printf '%s  %s\n' '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757' "$tools/actionlint.tgz" | sha256sum --check --status
          tar -xzf "$tools/actionlint.tgz" -C "$tools"; chmod 0755 "$tools/actionlint"; export PATH="$tools:$PATH"
          python -m venv "$tools/yamllint-venv"
          "$tools/yamllint-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir 'yamllint==1.37.1'
          actionlint .github/workflows/*.yml
          find .github/workflows platform -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | xargs -0 "$tools/yamllint-venv/bin/yamllint" -c .yamllint.yml

          curl --fail --location --silent --show-error --max-time 60 'https://github.com/terraform-linters/tflint/releases/download/v0.59.1/tflint_linux_amd64.zip' -o "$tools/tflint.zip"
          printf '%s  %s\n' '6108d84282292f11d793dc8038ce08fbc629dcd25324d6f13c63d8100b52e01f' "$tools/tflint.zip" | sha256sum --check --status
          unzip -q "$tools/tflint.zip" -d "$tools/tflint"
          export PATH="$tools/tflint:$tools:$PATH"
          config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --init --config "$config"
          while IFS= read -r -d '' file; do
            relative="${file#"$GITHUB_WORKSPACE/"}"
            git -C "$GITHUB_WORKSPACE" ls-files --error-unmatch -- "$relative" >/dev/null 2>&1 || continue
            dirname "$file"
          done < <(find "$GITHUB_WORKSPACE/platform/terraform" -type f -name '*.tf' -not -path '*/.terraform/*' -print0) | sort -u > "$tools/tflint-dirs"
          while IFS= read -r dir; do
            tflint --chdir "$dir" --config "$config"
          done < "$tools/tflint-dirs"

          curl --fail --location --silent --show-error --max-time 60 'https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz' -o "$tools/kubeconform.tgz"
          printf '%s  %s\n' 'c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3' "$tools/kubeconform.tgz" | sha256sum --check --status
          tar -xzf "$tools/kubeconform.tgz" -C "$tools"
          kubeconform -strict -ignore-missing-schemas -schema-location default platform/gitops/project.yaml platform/gitops/root-application.yaml platform/gitops/apps platform/gitops/resources

          curl --fail --location --silent --show-error --max-time 60 'https://github.com/kyverno/kyverno/releases/download/v1.15.2/kyverno-cli_v1.15.2_linux_x86_64.tar.gz' -o "$tools/kyverno.tgz"
          printf '%s  %s\n' 'c90520ba24fb8b8df003ec22d6d2621e4a3d3c7497665fdcf84e9eab4ff1dfe0' "$tools/kyverno.tgz" | sha256sum --check --status
          tar -xzf "$tools/kyverno.tgz" -C "$tools"
          kyverno apply platform/gitops/resources/kyverno-policies.yaml --resource platform/gitops/apps/namespaces.yaml | tee "$TMPDIR/kyverno-apply.txt"
          grep -Eq 'error: 0([, ]|$)' "$TMPDIR/kyverno-apply.txt"
          kyverno test platform/test-fixtures/kyverno

          curl --fail --location --silent --show-error --max-time 60 'https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz' -o "$tools/gitleaks.tgz"
          printf '%s  %s\n' 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb' "$tools/gitleaks.tgz" | sha256sum --check --status
          tar -xzf "$tools/gitleaks.tgz" -C "$tools"
          gitleaks detect --no-banner --redact --config .gitleaks.toml --exit-code 1

          curl --fail --location --silent --show-error --max-time 60 'https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz' -o "$tools/trivy.tgz"
          printf '%s  %s\n' 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f' "$tools/trivy.tgz" | sha256sum --check --status
          tar -xzf "$tools/trivy.tgz" -C "$tools"
          trivy config --exit-code 1 --severity HIGH,CRITICAL --no-progress .
      - name: Documentation local links
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import pathlib, re
          for p in pathlib.Path('docs').rglob('*.md'):
              for target in re.findall(r'\[[^]]+\]\(([^)#]+)', p.read_text()):
                  if not target.startswith(('http://', 'https://', '#')): assert (p.parent / target).resolve().exists(), f'{p}: {target}'
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, official, retrieved 2026-10-04
        with: {name: 'platform-validation-${{ github.run_id }}', path: '${{ runner.temp }}/ehr-platform', if-no-files-found: ignore, retention-days: 7}
