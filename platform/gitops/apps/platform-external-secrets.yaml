apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: platform-external-secrets, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "-6"}}
spec:
  project: ehr
  source: {repoURL: https://charts.external-secrets.io, chart: external-secrets, targetRevision: 0.16.2, helm: {valuesObject: {installCRDs: true}}}
  destination: {server: https://kubernetes.default.svc, namespace: external-secrets}
  syncPolicy: {automated: {prune: true, selfHeal: true, allowEmpty: false}, syncOptions: [CreateNamespace=true, PruneLast=true]}
