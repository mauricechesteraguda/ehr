apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: platform-cert-manager, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "-8"}}
spec:
  project: ehr
  source: {repoURL: https://charts.jetstack.io, chart: cert-manager, targetRevision: 1.17.2, helm: {valuesObject: {crds: {enabled: true}}}}
  destination: {server: https://kubernetes.default.svc, namespace: cert-manager}
  syncPolicy: {automated: {prune: true, selfHeal: true, allowEmpty: false}, syncOptions: [CreateNamespace=true, PruneLast=true]}
