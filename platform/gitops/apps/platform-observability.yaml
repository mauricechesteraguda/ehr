apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: platform-observability, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "30"}}
spec:
  project: ehr
  sources:
    - {repoURL: https://prometheus-community.github.io/helm-charts, chart: kube-prometheus-stack, targetRevision: 69.8.2, helm: {valuesObject: {grafana: {enabled: true, service: {type: ClusterIP}, resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 100m, memory: 128Mi}}}, alertmanager: {enabled: true, service: {type: ClusterIP}, resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 50m, memory: 64Mi}}}, prometheus: {prometheusSpec: {retention: 3d, resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 512Mi}}}}}}}
    - {repoURL: https://grafana.github.io/helm-charts, chart: loki, targetRevision: 6.29.0, helm: {valuesObject: {deploymentMode: SingleBinary, loki: {auth_enabled: false, limits_config: {retention_period: 168h}}, singleBinary: {resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 100m, memory: 256Mi}}}}}}
    - {repoURL: https://grafana.github.io/helm-charts, chart: alloy, targetRevision: 0.12.2, helm: {valuesObject: {service: {type: ClusterIP}, resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 75m, memory: 96Mi}}}}}
  destination: {server: https://kubernetes.default.svc, namespace: ehr-platform}
  syncPolicy: {automated: {prune: true, selfHeal: true, allowEmpty: false}, syncOptions: [CreateNamespace=true, PruneLast=true]}
