apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ehr
  namespace: argocd
  annotations:
    type-10042026-Maurice: "restrictive single-repository project"
spec:
  description: Synthetic EHR desired state; one Argo CD instance per cluster.
  sourceRepos:
    - https://github.com/example/ehr.git
    - https://charts.jetstack.io
    - https://gateway.envoyproxy.io
    - https://charts.external-secrets.io
    - https://kyverno.github.io/kyverno
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
  destinations:
    - {server: https://kubernetes.default.svc, namespace: ehr-demo}
    - {server: https://kubernetes.default.svc, namespace: ehr-k3s}
    - {server: https://kubernetes.default.svc, namespace: ehr-development}
    - {server: https://kubernetes.default.svc, namespace: ehr-staging}
    - {server: https://kubernetes.default.svc, namespace: ehr-production}
    - {server: https://kubernetes.default.svc, namespace: ehr-platform}
    - {server: https://kubernetes.default.svc, namespace: argocd}
    - {server: https://kubernetes.default.svc, namespace: envoy-gateway-system}
    - {server: https://kubernetes.default.svc, namespace: cert-manager}
    - {server: https://kubernetes.default.svc, namespace: external-secrets}
    - {server: https://kubernetes.default.svc, namespace: kyverno}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: gateway.networking.k8s.io, kind: GatewayClass}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: kyverno.io, kind: ClusterPolicy}
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
  syncWindows:
    - kind: deny
      schedule: "0 0 * * *"
      duration: 0m
      applications: [ehr-production]
      manualSync: true
