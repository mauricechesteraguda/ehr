apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: {name: ehr-provider-neutral, namespace: ehr-production}
spec:
  provider:
    aws: {service: SecretsManager, region: synthetic-region-1, auth: {jwt: {serviceAccountRef: {name: ehr-secret-provider}}}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: ehr-runtime, namespace: ehr-production}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: ehr-provider-neutral, kind: SecretStore}
  target: {name: ehr-runtime, creationPolicy: Owner}
  data:
    - {secretKey: DATABASE_URL, remoteRef: {key: ehr/runtime/database-url}}
    - {secretKey: REDIS_URL, remoteRef: {key: ehr/runtime/redis-url}}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: {name: ehr-gcp-provider-template, namespace: ehr-production}
spec:
  provider:
    gcpsm: {projectID: synthetic-project, auth: {workloadIdentity: {serviceAccountRef: {name: ehr-secret-provider}}}}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: {name: ehr-azure-provider-template, namespace: ehr-production}
spec:
  provider:
    azurekv: {vaultUrl: https://synthetic-vault.invalid, authType: WorkloadIdentity, serviceAccountRef: {name: ehr-secret-provider}}
# Select exactly one provider per installation. Workload identity is mandatory; static keys are prohibited.
