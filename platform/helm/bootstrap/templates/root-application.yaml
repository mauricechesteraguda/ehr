apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.rootName }}
  namespace: {{ .Values.argocdNamespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    type-10042026-Maurice: "one root per cluster"
spec:
  project: {{ .Values.projectName }}
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.revision | quote }}
    path: platform/gitops/apps
  destination: {server: https://kubernetes.default.svc, namespace: {{ .Values.argocdNamespace }}}
  syncPolicy: {syncOptions: [CreateNamespace=true, PruneLast=true]}
