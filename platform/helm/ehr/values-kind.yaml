# type-10042026-Maurice: local kind profile; dependencies and secrets are created
# by the opt-in acceptance target, never stored in Git.
environment: demo
profile: lightweight
provider: none
replicaCount: {web: 1, api: 1, worker: 1, beat: 1}
singleNode: {enabled: true, pdbEnabled: false, topologySpreadEnabled: false}
autoscaling:
  api: {enabled: false, minReplicas: 1, maxReplicas: 1, targetCPUUtilizationPercentage: 70}
  web: {enabled: false, minReplicas: 1, maxReplicas: 1, targetCPUUtilizationPercentage: 70}
  worker: {enabled: false, minReplicas: 1, maxReplicas: 1, targetCPUUtilizationPercentage: 70}
telemetry: {profile: lightweight, serviceMonitor: false}
seed: {enabled: false}
