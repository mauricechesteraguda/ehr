apiVersion: v1
kind: Service
metadata:
  name: {{ include "ehr.fullname" . }}-web
  labels:
{{ include "ehr.commonLabels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
{{ include "ehr.selector" . | indent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ehr.fullname" . }}-api
  labels:
{{ include "ehr.commonLabels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
{{ include "ehr.selector" . | indent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
