{{- if .Values.seed.enabled }}
{{- if eq .Values.environment "production" }}{{ fail "synthetic seed is forbidden in production" }}{{ end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ehr.fullname" . }}-seed
  labels:
{{ include "ehr.commonLabels" . | indent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: {{ include "ehr.image" . | quote }}
          command: ["python", "/app/backend/manage.py", "seed_demo"]
          envFrom:
            - configMapRef: {name: {{ include "ehr.fullname" . }}-config}
            - secretRef: {name: {{ .Values.secrets.django }}}
            - secretRef: {name: {{ .Values.secrets.database }}}
          env:
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.django }}, key: {{ .Values.seed.passwordSecretKey }}}
          securityContext:
{{ include "ehr-library.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | indent 12 }}
          resources:
{{ include "ehr-library.resources" .Values.resources.api | indent 12 }}
{{- end }}
