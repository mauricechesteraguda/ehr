{{- range $component := list "web" "api" "worker" }}
{{- $autoscaling := index $.Values.autoscaling $component }}
{{- if $autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ehr.fullname" $ }}-{{ $component }}
  labels:
{{ include "ehr.commonLabels" $ | indent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "ehr.fullname" $ }}-{{ $component }}}
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
